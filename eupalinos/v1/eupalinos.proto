syntax = "proto3";

package eupalinos.v1;

option go_package = "github.com/odysseia-greek/agora/eupalinos/v1;v1";

enum Operation {
  ENQUEUE = 0;
  DEQUEUE = 1;
  ACKNOWLEDGE = 2;
  NACK = 3;
}

message InternalEpistello {
  string id = 1;

  oneof payload {
    string data = 2;
    bytes bytes_data = 3;
  }

  string channel = 4;
  string traceid = 5;
  uint32 nack_count = 6;
}

message DeliveryMetadata {
  uint32 nack_count = 1;
}

message Epistello {
  string id = 1;
  string data = 2;
  string channel = 4;
  DeliveryMetadata delivery = 5;
}

message EpistelloBytes {
  string id = 1;
  bytes data = 2;
  string channel = 4;
  DeliveryMetadata delivery = 5;
}

message MessageUpdate {
  Operation operation = 1;
  InternalEpistello message = 2;
}

message Diexodos {
  string name = 1;
}

message ChannelInfo {
  string name = 1;

  // When enabled, dequeue reserves a message until AcknowledgeMessage is called.
  bool ack_mode = 2;
}

message AcknowledgeRequest {
  string channel = 1;
  string id = 2;
}

message AcknowledgeResponse {
  bool acknowledged = 1;
}

message NackRequest {
  string channel = 1;
  string id = 2;
}

message NackResponse {
  bool requeued = 1;
  uint32 nack_count = 2;
}

message Empty {}

message QueueLength {
  int32 length = 1;
  int32 pending_acknowledgements = 2;
}

message EnqueueResponse {
  string id = 1;
}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  string time = 2;
  string version = 3;
}

service Eupalinos {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc StreamQueueUpdates(stream MessageUpdate) returns (stream InternalEpistello);
  rpc EnqueueMessage(Epistello) returns (EnqueueResponse);
  rpc EnqueueMessageBytes(EpistelloBytes) returns (EnqueueResponse);
  rpc DequeueMessage(ChannelInfo) returns (Epistello);
  rpc DequeueMessageBytes(ChannelInfo) returns (EpistelloBytes);
  rpc AcknowledgeMessage(AcknowledgeRequest) returns (AcknowledgeResponse);
  rpc NackMessage(NackRequest) returns (NackResponse);
  rpc GetQueueLength(ChannelInfo) returns (QueueLength);
}
